name: publish-image

# Builds the image for amd64 and arm64 and pushes it to GHCR as
# X.Y.Z, X.Y and latest. Called by release-please after a release, or run by
# hand to (re)publish an existing release tag.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to build, e.g. yt-dlp-z-v0.1.1
        type: string
        required: true
      version:
        description: Version without the v, e.g. 0.1.1
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yt-dlp-z
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=yt-dlp-z
            org.opencontainers.image.licenses=Unlicense
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

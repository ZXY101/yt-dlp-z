name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      extension_release_created: ${{ steps.release.outputs['extension--release_created'] }}
      extension_tag_name: ${{ steps.release.outputs['extension--tag_name'] }}
      extension_version: ${{ steps.release.outputs['extension--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Releases made with GITHUB_TOKEN don't trigger other workflows, so the image
  # is published from here rather than from an `on: release` workflow.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-image.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}
    permissions:
      contents: read
      packages: write

  # A zip of the built extension on its GitHub release, for installing it by hand.
  extension-zip:
    needs: release-please
    if: needs.release-please.outputs.extension_release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.extension_tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w extension
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.extension_tag_name }}
          VERSION: ${{ needs.release-please.outputs.extension_version }}
        run: |
          (cd extension/dist && zip -r "../yt-dlp-z-extension-$VERSION.zip" .)
          gh release upload "$TAG" "extension/yt-dlp-z-extension-$VERSION.zip"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#d4459a" />
    <meta name="description" content="Self-hosted web dashboard for yt-dlp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yt-dlp-z</title>
    <script>
      // Runs before the first paint so a dark page doesn't flash white. lib/theme.ts takes over.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("yt-dlp-z-theme");
        } catch (error) {}
        var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

services:
  yt-dlp-z:
    image: ghcr.io/zxy101/yt-dlp-z:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: yt-dlp-z
    ports:
      - "9742:9742"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      # Recommended if others can reach the server: setup will ask for this password.
      # YTDLPZ_ADMIN_PASSWORD: change-me
      # Uncomment only if a reverse proxy in front of the app handles login.
      # YTDLPZ_AUTH_MODE: none
    volumes:
      - ./config:/config
      - ./downloads:/downloads
    restart: unless-stopped
    # Time to finish files of running recordings when stopped (Docker's default is 10 s).
    # Saving a long recording (merge, thumbnail) can take minutes; the app waits up to 10.
    stop_grace_period: 10m

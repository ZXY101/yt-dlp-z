# Git hooks. Installed by `npm install` at the repo root (runs `lefthook install`).
# CI runs the same checks plus the E2E suite and a Docker build.
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --staged --redact --no-banner
    prettier:
      glob: "*.{ts,tsx,js,mjs,cjs,json,md,yml,yaml,css,html}"
      run: npx --no -- prettier --check {staged_files}
    oxlint:
      glob: "*.{ts,tsx,js,mjs,cjs}"
      # Staged files may all be lint-ignored (e.g. the generated API types).
      run: npx --no -- oxlint --deny-warnings --no-error-on-unmatched-pattern {staged_files}
    ruff:
      root: "backend/"
      glob: "*.py"
      run: uv run ruff format --check {staged_files} && uv run ruff check {staged_files}
    mypy:
      root: "backend/"
      glob: "*.py"
      run: uv run mypy
    frontend-types:
      root: "frontend/"
      glob: "*.{ts,tsx}"
      run: npx --no -- tsc -b
    e2e-types:
      root: "e2e/"
      glob: "*.ts"
      run: npx --no -- tsc -p .

pre-push:
  parallel: true
  commands:
    backend-tests:
      root: "backend/"
      run: uv run pytest -q
    frontend-tests:
      root: "frontend/"
      run: npm run test:coverage

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
